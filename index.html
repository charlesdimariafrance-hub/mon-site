<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charles Stuart Di Maria</title>
<style>
  :root { --bg:#faf8f4; --ink:#1d1b18; --muted:#6b665e; --accent:#c8692c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16140f; --ink:#f2eee6; --muted:#a39d92; } }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font-family: Georgia, "Times New Roman", serif; padding:24px; }
  main { max-width:560px; text-align:center; }
  .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); margin:0 auto 28px;
         animation:pulse 2s ease-in-out infinite; }
  h1 { font-size:clamp(2rem,6vw,3rem); font-weight:normal; letter-spacing:-.01em; }
  p { margin-top:16px; color:var(--muted); font-family: system-ui, sans-serif; font-size:1.05rem; }
  @keyframes pulse { 50% { opacity:.3; transform:scale(.8); } }
</style>
</head>
<body>
<main>
  <div class="dot"></div>
  <h1>Charles Stuart Di Maria</h1>
  <p>Le site arrive bientôt.</p>
</main>
</body>
</html>
