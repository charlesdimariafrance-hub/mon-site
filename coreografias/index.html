<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base href="/coreografias/">
<title>Coreografías · Che, on danse!</title>
<meta name="description" content="Las coreografías del espectáculo de Berisso, figura por figura, con la música.">
<link rel="preload" href="../fonts/bodoni-moda-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../fonts/work-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face { font-family: "Bodoni Moda"; src: url(../fonts/bodoni-moda-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Bodoni Moda"; src: url(../fonts/bodoni-moda-latin-400-italic.woff2) format("woff2"); font-weight: 400; font-style: italic; font-display: swap; }
@font-face { font-family: "Work Sans"; src: url(../fonts/work-sans-latin-400-normal.woff2) format("woff2"); font-weight: 400; font-display: swap; }
@font-face { font-family: "Work Sans"; src: url(../fonts/work-sans-latin-500-normal.woff2) format("woff2"); font-weight: 500; font-display: swap; }
@font-face { font-family: "Work Sans"; src: url(../fonts/work-sans-latin-600-normal.woff2) format("woff2"); font-weight: 600; font-display: swap; }
:root {
  --ink: #18233A; --paper: #fff; --mist: #EDF1F6; --line: #D5DCE6; --red: #A8262F; --gold: #D9B26A;
  --sky: #8DBBE3; --text: #22304A; --muted: #5A6880; --board: #fbfaf6; --grid: #ebe5d8;
  --serif: "Bodoni Moda", Didot, Georgia, serif; --sans: "Work Sans", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { overflow-x: clip; }
body { margin: 0; background: var(--mist); color: var(--text); font: 400 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; cursor: pointer; }

.top { background: var(--ink); color: #fff; }
.top__in { max-width: 1240px; margin: 0 auto; padding: 18px 20px 22px; }
.back { color: var(--sky); text-decoration: none; font-size: .9rem; }
.back:hover { color: #fff; }
.top h1 { font: 400 clamp(2rem, 5vw, 3.1rem)/1.05 var(--serif); margin: 10px 0 4px; }
.top h1 em { color: var(--sky); }
.top p { margin: 0; color: #c9d3e3; max-width: 60ch; }

.figs { display: flex; gap: 8px; overflow-x: auto; padding: 18px 20px 4px; max-width: 1240px; margin: 0 auto; scrollbar-width: thin; }
.fig { flex: 0 0 auto; border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 9px 14px; display: flex; align-items: baseline; gap: 8px; white-space: nowrap; }
.fig b { font: 400 1.25rem/1 var(--serif); color: var(--red); }
.fig small { color: var(--muted); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; }
.fig:hover { border-color: var(--ink); }
.fig[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.fig[aria-pressed="true"] b { color: var(--gold); }
.fig[aria-pressed="true"] small { color: #c9d3e3; }

.main { max-width: 1240px; margin: 0 auto; padding: 14px 20px 48px; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 28px; align-items: start; }
.stage { position: sticky; top: 14px; }
.board { position: relative; width: 100%; max-width: min(100%, 74vh); margin: 0 auto; aspect-ratio: 1/1; border-radius: 18px; overflow: hidden; border: 2px solid var(--ink);
  background: linear-gradient(var(--grid) 1px, transparent 1px) 0 0/10% 10%, linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/10% 10% var(--board); box-shadow: 0 18px 40px rgba(24,35,58,.14); }
.board__front { position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); font-size: .68rem; letter-spacing: .16em; text-transform: uppercase; color: #a39b8a; }
.trails { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.trails path { fill: none; stroke-width: .4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: .8 1.2; opacity: .45; }
.dancer { position: absolute; width: 11%; aspect-ratio: 1/1; transform: translate(-50%, -50%); }
.dancer .rotor { position: absolute; inset: 0; }
.dancer .nose { position: absolute; left: 50%; top: 12%; width: 3px; height: 17%; background: var(--c); transform: translateX(-50%); border-radius: 2px; }
.dancer .circle { position: absolute; inset: 28%; border-radius: 50%; border: 2.5px solid var(--c); box-shadow: 0 1px 3px rgba(0,0,0,.28); background: #fff; }
.dancer.h .circle { background: var(--c); }
.dancer .num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 600 clamp(9px, 1.5vw, 13px)/1 var(--sans); color: var(--c); }
.dancer.h .num { color: #fff; }
.empty { margin: 0 auto 10px; max-width: min(100%, 74vh); background: #fff; border-left: 3px solid var(--gold); padding: 8px 12px; font-size: .86rem; color: var(--muted); }
.panel.static .controls, .panel.static .tl, .panel.static .hint, .panel.static .parts, .panel.static .opts, .panel.static .now { display: none; }
.panel.static h2 { margin-bottom: 14px; }
.panel { display: flex; flex-direction: column; }
.panel.static h2 { order: -2; }
.panel.static .video { order: -1; margin: 0 0 22px; }

.panel { background: #fff; border: 1px solid var(--line); padding: clamp(18px, 3vw, 28px); }
.panel h2 { font: 400 clamp(1.7rem, 3vw, 2.3rem)/1.1 var(--serif); margin: 0 0 4px; color: var(--ink); }
.now { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 18px; min-height: 2rem; }
.now span { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.now strong { font: 400 1.5rem/1.1 var(--serif); color: var(--red); }

.controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.play { width: 58px; height: 58px; border-radius: 50%; border: 0; background: var(--red); color: #fff; display: grid; place-items: center; flex: 0 0 auto; transition: transform .15s, background .15s; }
.play:hover { background: #8A1E26; transform: scale(1.05); }
.play svg { width: 24px; height: 24px; fill: currentColor; }
.clock { font: 500 .95rem/1 var(--sans); font-variant-numeric: tabular-nums; color: var(--ink); min-width: 92px; }
.speed { display: inline-flex; border: 1px solid var(--line); margin-left: auto; }
.speed button { border: 0; background: #fff; padding: 7px 10px; font-size: .82rem; color: var(--muted); }
.speed button + button { border-left: 1px solid var(--line); }
.speed button[aria-pressed="true"] { background: var(--ink); color: #fff; }

.tl { position: relative; height: 46px; margin: 18px 0 6px; background: var(--mist); cursor: pointer; touch-action: none; user-select: none; }
.tl__seg { position: absolute; top: 0; bottom: 0; border-right: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: .72rem; color: var(--muted); overflow: hidden; white-space: nowrap; }
.tl__seg.on { background: #dfe7f1; color: var(--ink); font-weight: 600; }
.tl__fill { position: absolute; left: 0; top: 0; bottom: 0; background: rgba(168,38,47,.12); pointer-events: none; }
.tl__head { position: absolute; top: -5px; bottom: -5px; width: 3px; background: var(--red); transform: translateX(-50%); pointer-events: none; }
.tl__head::before { content: ""; position: absolute; top: -4px; left: 50%; width: 12px; height: 12px; border-radius: 50%; background: var(--red); transform: translateX(-50%); }
.hint { font-size: .78rem; color: var(--muted); margin: 0 0 16px; }

.parts { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 20px; }
.parts button { border: 1px solid var(--line); background: #fff; padding: 5px 10px; font-size: .82rem; color: var(--ink); }
.parts button:hover { border-color: var(--ink); }
.parts button.on { background: var(--red); border-color: var(--red); color: #fff; }

.opts { display: flex; align-items: center; gap: 8px; font-size: .88rem; color: var(--muted); margin-bottom: 18px; }
.opts input { accent-color: var(--red); width: 17px; height: 17px; }

.legend { border-top: 1px solid var(--line); padding-top: 16px; display: grid; gap: 10px; font-size: .86rem; color: var(--muted); }
.legend__row { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
.sw { display: inline-flex; align-items: center; gap: 6px; }
.dot { width: 14px; height: 14px; border-radius: 50%; border: 2.5px solid var(--c); background: var(--c); }
.dot.o { background: #fff; }

.video { margin-top: 20px; }
.video h3 { font: 400 1.25rem/1.2 var(--serif); margin: 0 0 8px; color: var(--ink); }
.video__frame { position: relative; aspect-ratio: 16/9; background: #000; }
.video__frame iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

.loading { text-align: center; padding: 60px 20px; color: var(--muted); }

@media (max-width: 900px) {
  .main { grid-template-columns: 1fr; gap: 16px; }
  .stage { position: static; }
  .board { max-width: 100%; border-radius: 12px; }
}
@media (max-width: 480px) {
  .figs { padding: 14px 16px 2px; } .main { padding: 10px 16px 40px; }
  .speed { margin-left: 0; }
}
</style>
</head>
<body>
<header class="top">
  <div class="top__in">
    <a class="back" href="../">← Che, on danse!</a>
    <h1>Coreografías <em>Berisso</em></h1>
    <p>Elegí una figura y tocá ▶. Los bailarines se mueven con la música; podés ir más lento o saltar a una parte.</p>
  </div>
</header>

<nav class="figs" id="figs" aria-label="Figuras"></nav>

<main class="main" id="main">
  <div class="loading" id="loading">Cargando las coreografías…</div>
</main>

<audio id="audio" preload="auto"></audio>

<script>
"use strict";
const $ = s => document.querySelector(s);
const HOME = {
  '1H':{x:55,y:15,rot:180}, '1D':{x:45,y:15,rot:180}, '3H':{x:45,y:85,rot:0}, '3D':{x:55,y:85,rot:0},
  '2H':{x:85,y:55,rot:270}, '2D':{x:85,y:45,rot:270}, '4H':{x:15,y:45,rot:90}, '4D':{x:15,y:55,rot:90},
  '5H':{x:82,y:24,rot:225}, '5D':{x:76,y:18,rot:225}, '6H':{x:18,y:76,rot:45}, '6D':{x:24,y:82,rot:45}
};
const COLOR = { '1':'#146fc7','2':'#f6a31a','3':'#1f8a5f','4':'#8a3ffc','5':'#d1495b','6':'#00838f' };
let IDS = Object.keys(HOME);

/* ---- Movimiento: mismas fórmulas que el editor ---- */
const norm = a => ((a % 360) + 360) % 360;
const lerp = (a, b, f) => a + (b - a) * f;
const angleLerp = (a, b, f) => { const d = ((b - a + 540) % 360) - 180; return norm(a + d * f); };
function segArcPoint(c, s, e, sweep, f) {
  const r0 = Math.hypot(s.x - c.x, s.y - c.y), r1 = Math.hypot(e.x - c.x, e.y - c.y);
  const a0 = Math.atan2(s.y - c.y, s.x - c.x) * 180 / Math.PI, r = r0 + (r1 - r0) * f, a = (a0 + sweep * f) * Math.PI / 180;
  return { x: c.x + r * Math.cos(a), y: c.y + r * Math.sin(a) };
}
function sampleTrajectory(sm, frac) {
  if (!Array.isArray(sm) || !sm.length) return { deltaAngle: 0, radialFactor: 1 };
  const f = Math.max(0, Math.min(1, frac));
  if (f <= sm[0].t) return { deltaAngle: sm[0].deltaAngle || 0, radialFactor: sm[0].radialFactor ?? 1 };
  for (let i = 1; i < sm.length; i++) if (f <= sm[i].t) {
    const a = sm[i-1], b = sm[i], u = (f - a.t) / ((b.t - a.t) || 1);
    return { deltaAngle: lerp(a.deltaAngle || 0, b.deltaAngle || 0, u), radialFactor: lerp(a.radialFactor ?? 1, b.radialFactor ?? 1, u) };
  }
  const z = sm[sm.length - 1]; return { deltaAngle: z.deltaAngle || 0, radialFactor: z.radialFactor ?? 1 };
}
function freeOrbitPoint(c, s, sm, f) {
  const q = sampleTrajectory(sm, f), r0 = Math.max(1e-6, Math.hypot(s.x - c.x, s.y - c.y));
  const a = Math.atan2(s.y - c.y, s.x - c.x) + q.deltaAngle * Math.PI / 180, r = r0 * q.radialFactor;
  return { x: c.x + r * Math.cos(a), y: c.y + r * Math.sin(a) };
}
const trajectoryPoint = (pv, p0, p1, f) => pv && pv.type === 'freeOrbit' && Array.isArray(pv.samples) ? freeOrbitPoint(pv.center, p0, pv.samples, f) : segArcPoint(pv.center, p0, p1, pv.sweep || 0, f);
function orient(pv, p0, p1, f) {
  const mode = pv.orient || 'rotate', cur = trajectoryPoint(pv, p0, p1, f);
  if (mode === 'fixed') return p0.rot;
  if (mode === 'toward') return norm(Math.atan2(pv.center.x - cur.x, -(pv.center.y - cur.y)) * 180 / Math.PI);
  if (mode === 'tangent' || mode === 'backward') {
    const e = .002, a = trajectoryPoint(pv, p0, p1, Math.max(0, f - e)), b = trajectoryPoint(pv, p0, p1, Math.min(1, f + e));
    const rot = Math.hypot(b.x - a.x, b.y - a.y) < 1e-8 ? p0.rot : norm(Math.atan2(b.x - a.x, -(b.y - a.y)) * 180 / Math.PI);
    return mode === 'backward' ? norm(rot + 180) : rot;
  }
  const q = pv.type === 'freeOrbit' ? sampleTrajectory(pv.samples, f) : { deltaAngle: (pv.sweep || 0) * f };
  return norm(p0.rot + q.deltaAngle);
}
function pivotArcPos(pv, p0, p1, f) { const c = trajectoryPoint(pv, p0, p1, f); return { x: c.x, y: c.y, rot: orient(pv, p0, p1, f) }; }

const num = v => Number.isFinite(Number(v)) ? Number(v) : undefined;
function normalizeMovement(m) {
  const start = num(m.startTime) ?? (Number(m.anchor) || 0);
  const dur = num(m.duration) > 0 ? num(m.duration) : Math.max(.2, Number(m.reservedSpan) || 0);
  const end = Math.max(start + .1, num(m.endTime) ?? start + dur);
  m.startTime = start; m.endTime = end;
  let cur = start;
  m.steps.forEach((s, i) => {
    if (i === 0) { s.startTime = start; s.endTime = start; cur = start; return; }
    const ex = num(s.endTime), se = ex ?? cur + (Number(s.duration) || 0);
    s.startTime = cur; s.endTime = Math.max(cur + .1, Math.min(se, end)); cur = s.endTime;
  });
}
function flatten(fig) {
  const out = [];
  fig.mouvements.forEach((m, mi) => { normalizeMovement(m); m.steps.forEach(s => out.push({ pos: s.pos || {}, pivots: s.pivots, t: s.endTime, mi })); });
  return out;
}
function posAt(steps, t) {
  if (!steps.length) return HOME;
  if (t <= steps[0].t) return steps[0].pos;
  const L = steps.length - 1;
  if (t >= steps[L].t) return steps[L].pos;
  let i = 0; while (i < L && steps[i+1].t < t) i++;
  const a = steps[i], b = steps[i+1], f = (t - a.t) / ((b.t - a.t) || 1), pv = b.pivots || {}, out = {};
  IDS.forEach(id => {
    const p0 = a.pos[id] || HOME[id], p1 = b.pos[id] || p0;
    out[id] = pv[id] ? pivotArcPos(pv[id], p0, p1, f) : { x: lerp(p0.x, p1.x, f), y: lerp(p0.y, p1.y, f), rot: angleLerp(p0.rot, p1.rot, f) };
  });
  return out;
}

/* ---- Estado ---- */
let DATA, fig, steps = [], total = 0, cur = 0, playing = false, rate = 1, lastTs = null, raf = null, showTrails = true;
const audio = $('#audio');
const hasAudio = () => !!(fig && fig.audio) && !audio.error;
const fmt = t => { t = Math.max(0, t); return Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0'); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
const cap = s => { s = String(s).trim(); return s.charAt(0).toUpperCase() + s.slice(1); };
const nice = s => cap(String(s).replace(/^\d+\s+(?=\D)/, ''));
const ytId = u => (String(u).match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/) || [])[1];

function buildShell() {
  $('#main').innerHTML = `
  <div class="stage">
    <div class="board" id="board">
      <svg class="trails" id="trails" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
    </div>
  </div>
  <section class="panel" aria-live="polite">
    <h2 id="title"></h2>
    <div class="now"><span>Ahora</span><strong id="nowName">—</strong></div>
    <div class="controls">
      <button class="play" id="play" aria-label="Reproducir"></button>
      <div class="clock" id="clock">0:00 / 0:00</div>
      <div class="speed" role="group" aria-label="Velocidad">
        <button data-r="0.5">×0,5</button><button data-r="0.75">×0,75</button><button data-r="1" aria-pressed="true">×1</button>
      </div>
    </div>
    <div class="tl" id="tl"><div class="tl__fill" id="tlFill"></div><div class="tl__head" id="tlHead"></div></div>
    <p class="hint">Tocá o arrastrá la barra para ir a otro momento.</p>
    <div class="parts" id="parts"></div>
    <label class="opts"><input type="checkbox" id="trailsOn" checked> Mostrar el recorrido de la parte actual</label>
    <div class="legend">
      <div class="legend__row" id="couples"></div>
      <div class="legend__row"><span class="sw"><i class="dot" style="--c:#555"></i> Caballero</span><span class="sw"><i class="dot o" style="--c:#555"></i> Dama</span><span>La rayita indica hacia dónde mira.</span></div>
    </div>
    <div class="video" id="video" hidden></div>
  </section>`;
  const board = $('#board');
  IDS.forEach(id => {
    const el = document.createElement('div'), c = id.slice(0, -1);
    el.className = 'dancer ' + (id.slice(-1) === 'H' ? 'h' : 'd'); el.id = 'd-' + id; el.style.setProperty('--c', COLOR[c] || '#555');
    el.innerHTML = `<div class="rotor"><div class="nose"></div></div><div class="circle"></div><div class="num">${c}</div>`;
    board.appendChild(el);
  });
  $('#couples').innerHTML = [...new Set(IDS.map(i => i.slice(0, -1)))].sort().map(c => `<span class="sw"><i class="dot" style="--c:${COLOR[c]}"></i> Pareja ${c}</span>`).join('');
  $('#play').onclick = toggle;
  document.querySelectorAll('.speed button').forEach(b => b.onclick = () => {
    rate = Number(b.dataset.r); audio.playbackRate = rate;
    document.querySelectorAll('.speed button').forEach(x => x.setAttribute('aria-pressed', x === b));
  });
  $('#trailsOn').onchange = e => { showTrails = e.target.checked; drawTrails(true); };
  const tl = $('#tl');
  const seekFromEvent = e => { const r = tl.getBoundingClientRect(); seek(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * total); };
  tl.addEventListener('pointerdown', e => { tl.setPointerCapture(e.pointerId); seekFromEvent(e); tl.onpointermove = seekFromEvent; });
  tl.addEventListener('pointerup', () => { tl.onpointermove = null; });
  updatePlayIcon();
}

function selectFig(i, push) {
  pause();
  fig = DATA.figures[i];
  steps = flatten(fig);
  const last = steps.length ? steps[steps.length - 1].t : 0;
  total = Math.max(last, .1);
  cur = 0;
  document.querySelectorAll('.fig').forEach((b, k) => b.setAttribute('aria-pressed', k === i));
  $('#title').textContent = nice(fig.name);
  const ms = fig.mouvements.filter(m => m.steps.length > 1 || m.name !== 'Départ');
  const hasDiagram = steps.length > 1;
  const old = $('.stage .empty'); if (old) old.remove();
  if (!hasDiagram) $('#board').insertAdjacentHTML('beforebegin', `<div class="empty">Esta figura todavía no tiene diagrama: acá ves la posición de salida.${fig.video ? ' Mirá el video.' : ''}</div>`);
  // audio
  audio.pause(); audio.removeAttribute('src');
  if (fig.audio) { audio.src = fig.audio; audio.playbackRate = rate; audio.load(); }
  audio.onloadedmetadata = () => { if (Number.isFinite(audio.duration)) { total = Math.max(total, audio.duration); buildTimeline(); render(); } };
  // partes
  $('#parts').innerHTML = ms.map((m, k) => `<button data-t="${m.startTime}">${esc(cap(m.name) || '·')}</button>`).join('');
  $('#parts').querySelectorAll('button').forEach(b => b.onclick = () => seek(Number(b.dataset.t)));
  $('#play').disabled = !hasDiagram && !fig.audio;
  document.querySelector('.panel').classList.toggle('static', !hasDiagram);
  const chip = document.querySelectorAll('.fig')[i]; if (chip) chip.scrollIntoView({ block: 'nearest', inline: 'center' });
  // video
  const v = $('#video'), id = fig.video && ytId(fig.video.url);
  if (id) {
    v.hidden = false;
    v.innerHTML = `<h3>Video</h3><div class="video__frame"><iframe src="https://www.youtube-nocookie.com/embed/${id}?rel=0" title="${esc(fig.video.title || fig.name)}" loading="lazy" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>`;
  } else { v.hidden = true; v.innerHTML = ''; }
  buildTimeline(); drawTrails(true); render();
  if (push !== false) try { history.replaceState(null, '', '#figura-' + fig.id); } catch (e) {}
}

function buildTimeline() {
  const tl = $('#tl');
  tl.querySelectorAll('.tl__seg').forEach(s => s.remove());
  fig.mouvements.forEach(m => {
    if (m.name === 'Départ' && m.steps.length < 2) return;
    const s = document.createElement('div');
    s.className = 'tl__seg';
    s.style.left = (m.startTime / total * 100) + '%';
    s.style.width = ((m.endTime - m.startTime) / total * 100) + '%';
    s.textContent = (m.endTime - m.startTime) / total > .045 ? cap(m.name) : '';
    s.title = cap(m.name);
    tl.insertBefore(s, $('#tlFill'));
  });
}

function currentMovementIndex(t) {
  let idx = -1;
  fig.mouvements.forEach((m, k) => { if (t >= m.startTime - 1e-6 && t < m.endTime) idx = k; });
  if (idx < 0 && t >= total - .05) idx = fig.mouvements.length - 1;
  return idx;
}

let trailFor = -2;
function drawTrails(force) {
  const svg = $('#trails'); if (!svg) return;
  const mi = currentMovementIndex(cur);
  if (!force && mi === trailFor) return;
  trailFor = mi;
  if (!showTrails || mi < 0 || steps.length < 2) { svg.innerHTML = ''; return; }
  const m = fig.mouvements[mi], n = 96, paths = {};
  IDS.forEach(id => paths[id] = []);
  for (let k = 0; k <= n; k++) {
    const p = posAt(steps, m.startTime + (m.endTime - m.startTime) * k / n);
    IDS.forEach(id => { const q = p[id] || HOME[id]; paths[id].push(q.x.toFixed(2) + ',' + q.y.toFixed(2)); });
  }
  svg.innerHTML = IDS.map(id => {
    const pts = paths[id]; if (pts[0] === pts[pts.length - 1] && new Set(pts).size === 1) return '';
    return `<path d="M${pts.join('L')}" stroke="${COLOR[id.slice(0, -1)]}"/>`;
  }).join('');
}

function render() {
  const p = posAt(steps, cur);
  IDS.forEach(id => {
    const el = document.getElementById('d-' + id), q = p[id] || HOME[id];
    el.style.left = q.x + '%'; el.style.top = q.y + '%';
    el.firstChild.style.transform = `rotate(${q.rot}deg)`;
  });
  const f = Math.min(1, cur / total);
  $('#tlFill').style.width = (f * 100) + '%'; $('#tlHead').style.left = (f * 100) + '%';
  $('#clock').textContent = fmt(cur) + ' / ' + fmt(total);
  const mi = currentMovementIndex(cur), m = fig.mouvements[mi];
  $('#nowName').textContent = m && !(m.name === 'Départ') ? cap(m.name) : (cur <= .2 ? 'Salida' : '—');
  const segs = [...document.querySelectorAll('.tl__seg')], shown = fig.mouvements.filter(x => !(x.name === 'Départ' && x.steps.length < 2));
  segs.forEach((s, k) => s.classList.toggle('on', shown[k] === m));
  document.querySelectorAll('#parts button').forEach((b, k) => b.classList.toggle('on', shown[k] === m));
  drawTrails(false);
}

function updatePlayIcon() {
  const b = $('#play'); if (!b) return;
  b.innerHTML = playing ? '<svg viewBox="0 0 24 24"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>' : '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
  b.setAttribute('aria-label', playing ? 'Pausa' : 'Reproducir');
}
function tick(ts) {
  if (!playing) return;
  if (hasAudio() && !audio.paused && !audio.seeking && audio.readyState >= 2) cur = audio.currentTime;
  else { if (lastTs !== null) cur += (ts - lastTs) / 1000 * rate; lastTs = ts; }
  if (cur >= total || (hasAudio() && audio.ended)) { cur = Math.min(cur, total); render(); pause(); return; }
  render();
  raf = requestAnimationFrame(tick);
}
function play() {
  if (cur >= total - .05) cur = 0;
  playing = true; lastTs = null; updatePlayIcon();
  if (hasAudio()) { setAudioTime(cur); audio.playbackRate = rate; audio.play().catch(() => {}); }
  raf = requestAnimationFrame(tick);
}
function setAudioTime(t) {
  if (audio.readyState >= 1) { try { audio.currentTime = t; } catch (e) {} }
  else audio.addEventListener('loadedmetadata', () => { try { audio.currentTime = cur; } catch (e) {} }, { once: true });
}
function pause() { playing = false; audio.pause(); if (raf) cancelAnimationFrame(raf); raf = null; updatePlayIcon(); }
function toggle() { playing ? pause() : play(); }
function seek(t) {
  cur = Math.max(0, Math.min(total, t)); lastTs = null;
  if (hasAudio()) setAudioTime(cur);
  render();
}
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight') seek(cur + 2);
  if (e.code === 'ArrowLeft') seek(cur - 2);
});

fetch('coreo.json').then(r => r.json()).then(d => {
  DATA = d;
  if (Array.isArray(d.dancers) && d.dancers.length) IDS = d.dancers.filter(id => HOME[id]);
  $('#figs').innerHTML = d.figures.map((f, i) => {
    const has = f.mouvements.some(m => m.steps.length > 1), extra = !has ? (f.video ? 'video' : 'salida') : (f.audio ? 'con música' : '');
    return `<button class="fig" aria-pressed="false" data-i="${i}"><b>${f.id}</b>${esc(nice(f.name))}${extra ? ` <small>${extra}</small>` : ''}</button>`;
  }).join('');
  $('#figs').querySelectorAll('.fig').forEach(b => b.onclick = () => selectFig(Number(b.dataset.i)));
  buildShell();
  const m = location.hash.match(/figura-(\d+)/), start = m ? d.figures.findIndex(f => String(f.id) === m[1]) : 0;
  selectFig(start >= 0 ? start : 0, false);
}).catch(() => { $('#loading').textContent = 'No se pudieron cargar las coreografías. Probá recargar la página.'; });
</script>
</body>
